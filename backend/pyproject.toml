[project]
name = "healthcare-rag"
version = "0.1.0"
description = "Citation-first, evidence-validated RAG over (synthetic) healthcare guidelines."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
# Direct runtime dependencies are pinned exactly; uv.lock pins the full tree.
# Dependencies are added in the phase that first uses them.
dependencies = [
    "aiosqlite==0.22.1",       # Phase 5: SQLite driver (unit/API tests, dev without Docker)
    "alembic==1.20.1",         # Phase 5: schema migrations
    "argon2-cffi==25.1.0",     # Phase 5: password hashing (Argon2id)
    "asyncpg==0.32.0",         # Phase 5: PostgreSQL driver
    "faiss-cpu==1.16.0",       # Phase 1: exact vector index (ADR-0005)
    "fastapi==0.162.5",
    "numpy==2.5.4",            # Phase 1: float32 vectors
    "prometheus-client==0.26.0",  # Phase 3: /metrics
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",           # Phase 5: access/refresh tokens (HS256)
    "pyyaml==6.0.3",           # Phase 1: corpus front-matter (safe_load only)
    "snowballstemmer==3.1.1",  # Phase 1: deterministic stemming (BM25; validation in Phase 3)
    "sqlalchemy[asyncio]==2.1.8",  # Phase 5: ORM, async engine
    "structlog==26.1.0",       # Phase 3: structured JSON logs with request IDs
    "uvicorn==0.54.0",         # Phase 3: ASGI server
]

[dependency-groups]
dev = [
    "bandit==1.9.4",  # Phase 7: security lint (also via ruff "S"; bandit is the reference)
    "detect-secrets==1.5.0",
    "httpx2==2.16.0",  # TestClient transport (starlette deprecates httpx)
    "hypothesis==6.170.15",  # property-based tests (validation maths)
    "mypy==2.4.1",
    "pip-audit==2.10.1",  # Phase 7: known-vulnerability scan of the locked dependencies
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "schemathesis==4.33.4",  # Phase 7: property-based contract fuzzing of openapi.json
    "testcontainers[postgres]==4.15.0",  # Phase 5: real PostgreSQL in integration tests
    "types-pyyaml==6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evaluation"]

[tool.uv]
default-groups = ["dev"]

# ----------------------------------------------------------------- ruff -------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
    "N",            # naming
    "S",            # bandit (security)
    "PT",           # pytest style
    "ASYNC",        # async pitfalls
    "T20",          # no stray print()
    "RUF",          # ruff-specific
]
# Line length is owned by `ruff format`; long string literals are left intact.
ignore = ["E501"]
# "›" is the section_path separator (H1 › H2 › H3) used throughout the contract.
allowed-confusables = ["›", "×", "–"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evaluation", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is the point of a test
"scripts/**" = ["T201"] # CLI scripts may print
# Evaluation entry points are CLIs that print their summary (library modules do not).
"evaluation/{build_gold,common,eval_retrieval,eval_validation,threshold_sweep,run,gate}.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# ----------------------------------------------------------------- mypy -------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "evaluation", "scripts", "tests"]
warn_unreachable = true
# tests/ has no __init__.py (pytest rootdir imports); map files to "tests.support" etc.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# snowballstemmer ships no type information; faiss stubs are partial.
module = ["faiss", "faiss.*", "snowballstemmer"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest ------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import scripts.* (the CLIs under backend/scripts)
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, isolated tests (default)",
    "integration: needs a built index or a database (Phase 1+)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app", "evaluation"]
# SQLAlchemy asyncio switches greenlets; without this, lines after an `await` on the
# database are reported as missed even though tests run them.
concurrency = ["greenlet", "thread"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
