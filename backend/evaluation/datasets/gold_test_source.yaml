# Held-out TEST questions, version 2 (ADR-0001, DATASET_CARD.md).
#
# Written on 2026-11-12, after the first test split (test-v1) had been used once and
# before any further tuning. Revised once before its first use: the draft targeted mostly
# single-source secondary facts (P@5 ceiling 0.45), so 17 items were replaced to follow the
# dev authoring protocol (core guidance covered by several organisations). test-v1 then
# joined the development pool. Never tune on these questions; run the test split once per
# frozen configuration. Same fields and grading rules as gold_source.yaml.

