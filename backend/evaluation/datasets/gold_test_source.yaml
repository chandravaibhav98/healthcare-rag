    kw: ["1–3 days"]
  - q: "Should an adverse event be reported if it is unclear whether the vaccine caused it?"
    kind: direct
    g2: [cdc-aefi-001::why-report::0001, who-aefi-001::what-to-report::0001, cdc-aefi-002::what-to-report::0001, who-aefi-002::which-events-to-report::0001]
