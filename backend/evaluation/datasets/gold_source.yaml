# Gold evaluation questions: authoring source (ADR-0001, DATASET_CARD.md).
#
# Edit THIS file, then run `uv run python -m evaluation.build_gold` to regenerate
# gold_dev.jsonl, gold_test.jsonl and gold_manifest.json (ids and the split are derived
# deterministically, so never edit the generated files by hand).
#
# Per item:
#   q     question text as a user would type it
#   kind  direct | paraphrase | acronym | unanswerable
#   g2    answer-bearing chunks (contain the facts needed for a correct answer)
#   g1    topically relevant chunks (same procedure or subject; do not answer it)
#   kw    terms a correct answer is expected to contain (diagnostics only)
#   seen  true if the question (or a near-duplicate) was used during Phases 2-3
#         (informational; every item in this file is development data)
#
# History: v1 of this file was split 76 dev / 68 test. That test half (test-v1) was used
# once on 2026-11-12 (results archived in docs/evaluation/test-v1-results.json) and then
# joined the development pool, so all 144 items here are dev. The held-out test set is
# gold_test_source.yaml.

