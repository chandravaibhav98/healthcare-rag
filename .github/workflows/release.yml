# Release (Phase 10, ADR-0016): publish what CI tested, never a rebuild.
#
#   publish  after ci.yml succeeds on a push to main: load that run's `images` artifact,
#            push ghcr.io/<owner>/rag-{api,web}:sha-<commit> (+ :main) and
#            rag-index:<index_version> (+ :sha-<commit>), SBOM each image (Syft), and
#            optionally sign it (Cosign keyless, repository variable SIGN_IMAGES=true).
#   release  on a v* tag: promote the tag's already-published sha-<commit> images to
#            :vX.Y.Z (same digests), render the prod overlay pinned to those digests, and
#            create a GitHub Release with the manifest, SBOMs and notes.
#   cleanup  after publish: delete untagged GHCR versions beyond the newest 20 (tagged
#            images, release tags and signatures are never touched).
#   demo     after release: record the narrated demo video (demo.yml, Phase 11) and
#            attach the MP4, GIF teaser and chapter list to the GitHub Release.
#
# Every action is pinned to a commit SHA; Syft and Cosign are checksum-verified binaries.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: 1.57.2
  SYFT_SHA256: ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b # pragma: allowlist secret (SHA-256, not a secret)
  COSIGN_VERSION: 3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa # pragma: allowlist secret (SHA-256, not a secret)

jobs:
  publish:
    name: publish images (main)
    # Only a green CI run for a push to main in this repository (not a fork, not a PR).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the images artifact of the CI run
      packages: write # push to GHCR
      id-token: write # Cosign keyless signing (only used when SIGN_IMAGES=true)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: artifacts/images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Load the tested images
        id: load
        run: |
          bash scripts/ci/load-images.sh artifacts/images
          cat artifacts/images/images.env >>"$GITHUB_OUTPUT"
      - name: Install Syft + Cosign (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz -C bin syft
          curl -fsSLo bin/cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  bin/cosign" | sha256sum -c -
          chmod +x bin/cosign
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push, SBOM, sign
        env:
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          INDEX_VERSION: ${{ steps.load.outputs.INDEX_VERSION }}
          EXTRA_TAG: main
          # Keyless signatures are recorded in the public Rekor transparency log (image
          # names and digests become public); leave this off for a private repository.
          SIGN: ${{ vars.SIGN_IMAGES == 'true' }}
        run: REGISTRY="ghcr.io/${OWNER,,}" bash scripts/ci/publish-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: artifacts/release/
          retention-days: 30
          if-no-files-found: error
      - name: Summary
        run: |
          {
            echo "### Published images"
            echo '```json'
            cat artifacts/release/release-manifest.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  cleanup:
    name: GHCR cleanup (${{ matrix.package }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [rag-api, rag-web, rag-index]
    steps:
      # Untagged versions only: every pushed image keeps its sha-<commit> tag, so this
      # removes nothing a release or a rollback can reference.
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20
          delete-only-untagged-versions: "true"

  release:
    name: release ${{ github.ref_name }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write # create the GitHub Release
      packages: write # add the release tag to the images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Syft (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          tar -xzf syft.tgz -C bin syft
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # The tag's commit must have passed CI on main; a tag pushed together with its
      # commit waits for that run to publish (up to 60 minutes).
      - name: Promote images, render manifests, SBOMs, notes
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          WAIT_MINUTES: "60"
        run: REGISTRY="ghcr.io/${OWNER,,}" bash scripts/ci/release.sh "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.ref_name }}
          path: artifacts/release/
          if-no-files-found: error
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd artifacts/release
          pre=(); [[ "$TAG" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" --verify-tag "${pre[@]}" --title "$TAG" \
            --notes-file notes.md --generate-notes \
            "healthcare-rag-$TAG.yaml" release-manifest.json sbom-*.spdx.json

  demo:
    name: demo video for ${{ github.ref_name }}
    needs: release
    permissions:
      contents: write # attach the video to the release
    uses: ./.github/workflows/demo.yml
    with:
      release_tag: ${{ github.ref_name }}
