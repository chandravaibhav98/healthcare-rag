# CI: lint + typecheck + tests on every PR and on main, the SC1 determinism gate
# (byte-identical index on Linux and Windows), the Phase 4 evaluation gate, the
# Phase 7 quality gates (coverage, Schemathesis, Playwright E2E, k6, security scans),
# the Phase 8 container gates (images, Compose stack, image scan) and the Phase 9
# Kubernetes gates (manifest schemas; kind deploy, E2E, zero-downtime rollouts).
# Jobs call scripts/*, the same entry points a developer uses, so "green on CI" and
# "green on my machine" mean the same thing. Phase 10 extends this pipeline.
#
# Third-party actions are pinned to a full commit SHA (tags can be force-pushed, as the
# March 2026 trivy-action compromise showed); GitHub's own actions use major tags.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows proves PowerShell parity and CRLF-safety from day one (risk R4).
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Linux: the PostgreSQL variants of the persistence tests run in a Testcontainers
      # container (the runner has Docker). Windows runners cannot run Linux containers, so
      # they cover SQLite only; the code under test is identical.
      # Browsers are installed by the e2e job only.
      - name: Setup + lint + test (bash)
        if: runner.os != 'Windows'
        run: bash scripts/setup.sh --ci --skip-playwright

      - name: Setup + lint + test (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SKIP_POSTGRES_TESTS: "1"
        run: ./scripts/setup.ps1 --ci --skip-playwright

      # Coverage gates (plan Phase 7): backend app/rag >= 90 %, app/services >= 85 %,
      # overall >= 80 % (scripts/coverage_gate.py); frontend >= 70 % (vite.config.ts).
      - name: Coverage gates (backend on SQLite + PostgreSQL, frontend)
        if: runner.os != 'Windows'
        run: bash scripts/test.sh --backend --frontend --coverage --ci

      - name: Upload coverage
        if: runner.os != 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            backend/coverage.xml
            backend/coverage.json
            frontend/coverage/
          if-no-files-found: ignore

  contract:
    name: contract fuzzing (Schemathesis, 100 examples per operation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --directory backend
      # Every operation in the committed openapi.json, positive and negative inputs, with
      # Schemathesis' response checks (status codes, content types, schemas, auth).
      - name: Schemathesis
        env:
          SCHEMATHESIS_MAX_EXAMPLES: "100"
        run: uv run --directory backend pytest tests/contract -q

  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      # --ci installs Chromium with its system libraries; lint and tests run in `quality`.
      - name: Setup (dependencies + Chromium)
        run: bash scripts/setup.sh --ci --no-verify
      - name: Functional E2E
        run: bash scripts/test.sh --e2e --ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  load:
    name: k6 load test (/qa, p95 < 300 ms, 0 % 5xx)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --directory backend
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with:
          k6-version: "2.4.0"
      # Pull requests get a one-minute run at full concurrency; main and manual runs get
      # the full plan gate (50 virtual users for 5 minutes).
      - name: Load test
        env:
          DURATION: ${{ github.event_name == 'pull_request' && '1m' || '5m' }}
        run: bash scripts/load-test.sh --vus 50 --duration "$DURATION" --ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-test
          path: |
            artifacts/load/summary.json
            artifacts/load-server.log
          if-no-files-found: ignore

  security:
    name: security scan (pip-audit, npm audit, bandit, gitleaks, trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: uv sync --locked --directory backend
      - run: npm ci --prefix frontend --no-audit --no-fund && npm ci --prefix e2e --no-audit --no-fund
      # gitleaks and trivy as release binaries, each checked against a SHA-256 recorded
      # here (no third-party action, no mutable tag). Trivy 0.69.4-0.69.6 were the
      # releases poisoned in March 2026 (CVE-2026-33634); 0.76.2 is a later, clean release.
      - name: Install gitleaks + trivy (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # pragma: allowlist secret (SHA-256, not a secret)
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf # pragma: allowlist secret (SHA-256, not a secret)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C bin gitleaks
          tar -xzf trivy.tgz -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # --strict fails the job if any scanner cannot run.
      - name: Security scan
        run: bash scripts/security-scan.sh --strict --ci

  manifests:
    name: Kubernetes manifests (kustomize + kubeconform)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform (checksum-verified)
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 # pragma: allowlist secret (SHA-256, not a secret)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar -xzf kc.tgz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Every overlay must render and every object must match its schema, CRDs included
      # (Gateway API, EnvoyProxy, ExternalSecret, ServiceMonitor from the CRDs catalog).
      - name: Render and validate base, local and prod
        run: |
          set -euo pipefail
          cp deploy/k8s/overlays/local/secrets.env.example deploy/k8s/overlays/local/secrets.env
          for overlay in base overlays/local overlays/prod; do
            echo "== $overlay"
            kubectl kustomize "deploy/k8s/$overlay" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  images:
    name: images + Compose stack (smoke, E2E, image scan)
    needs: determinism
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # One host drives the whole E2E suite and smoke test; production limits stay in .env.
      RATE_LIMIT_QA: 6000/minute
      LOGIN_RATE_LIMIT: 600/minute
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --directory backend
      - name: Build images, start the stack, seed, smoke test through nginx
        run: bash scripts/docker-up.sh --demo --ci
      # SC1 end to end: the index baked into the image is the one the determinism job built.
      - uses: actions/download-artifact@v8
        with:
          name: manifest-Linux
          path: determinism
      - name: Index image matches the determinism build
        run: |
          set -euo pipefail
          want=$(python3 -c 'import json;print(json.load(open("determinism/manifest-Linux.json"))["index_version"])')
          got=$(docker run --rm --network none rag-index:build cat /index/manifest.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["index_version"])')
          echo "determinism: $want  image: $got"
          test "$want" = "$got"
      - name: Image size budget (rag-api < 400 MB)
        run: |
          size=$(docker image inspect rag-api:local --format '{{.Size}}')
          echo "rag-api: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((400 * 1024 * 1024))
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: E2E against the Compose stack
        run: |
          set -euo pipefail
          npm ci --prefix e2e --no-audit --no-fund
          npm --prefix e2e exec -- playwright install --with-deps chromium
          E2E_PASSWORD=$(sed -n 's/^SEED_ADMIN_PASSWORD=//p' deploy/compose/.env) \
          E2E_BASE_URL=http://localhost:8080 npm --prefix e2e test
      - name: Install trivy (checksum-verified)
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf # pragma: allowlist secret (SHA-256, not a secret)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Image scan (no fixable CRITICAL)
        run: bash scripts/security-scan.sh --only trivy --images --strict --ci
      - name: Compose logs
        if: failure()
        run: bash scripts/docker-logs.sh --tail 300
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-e2e-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

  kubernetes:
    name: kind deploy (E2E, rolling restart, index rollback)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --directory backend
      - name: Install kind (checksum-verified)
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d # pragma: allowlist secret (SHA-256, not a secret)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/bin/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kind"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with:
          k6-version: "2.4.0"
      - name: kind cluster + Envoy Gateway + the app (scripts/k8s-up.sh)
        run: bash scripts/k8s-up.sh --ci
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: E2E against the cluster
        run: |
          set -euo pipefail
          npm ci --prefix e2e --no-audit --no-fund
          npm --prefix e2e exec -- playwright install --with-deps chromium
          E2E_PASSWORD=$(sed -n 's/^SEED_ADMIN_PASSWORD=//p' deploy/k8s/overlays/local/secrets.env) \
          E2E_BASE_URL=http://localhost:8088 npm --prefix e2e test
      - name: Zero-downtime checks (rolling restart, index rollout and rollback)
        run: bash scripts/k8s-verify.sh --ci
      - name: Cluster state
        if: always()
        run: |
          bash scripts/k8s-status.sh --ci || true
          kubectl --context kind-healthcare-rag -n healthcare-rag get events --sort-by=.lastTimestamp | tail -50 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kubernetes-verify
          path: |
            artifacts/k8s-verify/
            e2e/playwright-report/
          if-no-files-found: ignore

  determinism:
    name: index determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --directory backend
      - name: Rebuild 3x with different hash seeds (bash)
        if: runner.os != 'Windows'
        run: bash scripts/verify-determinism.sh --runs 3 --save-manifest determinism/manifest-${{ runner.os }}.json
      - name: Rebuild 3x with different hash seeds (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-determinism.ps1 --runs 3 --save-manifest determinism/manifest-${{ runner.os }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ runner.os }}
          path: determinism/manifest-${{ runner.os }}.json
          if-no-files-found: error

  determinism-cross-os:
    name: SC1 - identical index on Linux and Windows
    needs: determinism
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: manifest-*
          merge-multiple: true
          path: manifests
      - name: Compare manifests byte-for-byte
        run: |
          ls -l manifests
          cmp manifests/manifest-Linux.json manifests/manifest-Windows.json
          echo "index_version: $(python3 -c 'import json;print(json.load(open("manifests/manifest-Linux.json"))["index_version"])')"

  evaluation:
    name: evaluation gate (dev pool, no regression)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --directory backend
      - name: Build index, check gold files, run the gate
        run: bash scripts/eval.sh --split dev --gate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-report
          path: backend/evaluation/reports/
          if-no-files-found: ignore

  hygiene:
    name: pre-commit hygiene (whitespace, EOL, secrets, ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --directory backend
      - name: pre-commit (tool hooks are covered by the quality job)
        env:
          SKIP: mypy,contract-snapshots,eslint,prettier,tsc
        run: uv run --directory backend pre-commit run --all-files --show-diff-on-failure
