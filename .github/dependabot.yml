# Dependabot version updates (Phase 10, ADR-0016). Weekly, grouped by ecosystem so each
# area gets one PR. Every PR goes through ci-passed like any other change.
#
# The cooldown holds a brand-new release back for a week before Dependabot proposes it.
# Several 2025-2026 supply-chain attacks (poisoned npm packages, force-pushed action tags)
# were found and pulled within days, so this keeps them out of the queue. Security
# updates are not delayed by the cooldown.
#
# For github-actions, Dependabot updates the pinned SHA and its "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci" }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      python-minor-patch: { patterns: ["*"], update-types: [minor, patch] }
    commit-message: { prefix: "build(backend)" }

  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      npm-minor-patch: { patterns: ["*"], update-types: [minor, patch] }
    commit-message: { prefix: "build(web)" }

  # Base images in deploy/docker/*.Dockerfile and deploy/compose/*.yml.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      base-images: { patterns: ["*"] }
    commit-message: { prefix: "build(docker)" }

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      compose-images: { patterns: ["*"] }
    commit-message: { prefix: "build(compose)" }
