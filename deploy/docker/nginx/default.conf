# rag-web nginx site (deploy/docker/web.Dockerfile). Listens on 8080 as UID 101.
upstream rag_api {
    server __API_UPSTREAM__;
    keepalive 16;
}

# Pass the caller's request ID through, or start one, so a request can be followed from
# the nginx log into the API's JSON log (X-Request-ID, ADR-0006).
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API caps questions at 1,000 characters; nothing legitimate is larger than this.
    client_max_body_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/problem+json;

    # Liveness of nginx itself (Docker HEALTHCHECK, Kubernetes probes); never proxied.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API: same origin, so no CORS -------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Answers are small JSON; buffering keeps slow clients from holding API workers.
        proxy_buffering on;
    }

    # The spec's /qa alias and the API probes (used by scripts/smoke.*). /metrics and
    # /docs are deliberately NOT exposed through the public origin.
    location ~ ^/(qa|healthz|readyz|version)$ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- static assets ----------------------------------------------------------------
    # Vite fingerprints everything under /assets/, so it can be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the SPA: unknown paths get index.html (client-side routes),
    # and index.html is always revalidated so a deploy is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
