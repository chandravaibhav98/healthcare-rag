# Local overlay: kind + Envoy Gateway + in-cluster PostgreSQL (plan §4 Phase 9).
#
#   scripts/k8s-up.sh                      # builds, loads and applies this overlay
#   kubectl apply -k deploy/k8s/overlays/local   # after secrets.env exists
#
# The app is served on http://localhost:8088 (kind maps it to the gateway's NodePort).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: healthcare-rag
resources:
  - ../../base
  - postgres.yaml
  - seed-job.yaml
  - envoy-gateway.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: healthcare-rag
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
patches:
  - path: patch-config.yaml
  - path: patch-gateway.yaml
# Generated by scripts/k8s-up.* from secrets.env.example on first run (git-ignored).
# The name gets a content hash, so changing a secret rolls the pods that use it.
secretGenerator:
  - name: hcrag-secrets
    envs: [secrets.env]
images:
  - { name: rag-api, newName: rag-api, newTag: local }
  - { name: rag-web, newName: rag-web, newTag: local }
  - { name: rag-index, newName: rag-index, newTag: local }
  - { name: postgres, newName: postgres, newTag: 18-alpine }
