# Production secrets come from the platform's secret manager through the External
# Secrets Operator (AWS Secrets Manager, Azure Key Vault, GCP Secret Manager, Vault...).
# Nothing secret is committed; the store `platform-secrets` is owned by the platform team.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcrag-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: hcrag-secrets
    creationPolicy: Owner
  data:
    # postgresql+asyncpg://<user>:<password>@<managed-host>:5432/<db>?ssl=require
    - secretKey: DATABASE_URL # pragma: allowlist secret (a key name)
      remoteRef: { key: healthcare-rag/database-url }
    - secretKey: JWT_SECRET # pragma: allowlist secret (a key name)
      remoteRef: { key: healthcare-rag/jwt-secret }
