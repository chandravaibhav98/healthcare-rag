apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels: { app.kubernetes.io/component: api }
spec:
  selector:
    matchLabels: { app.kubernetes.io/component: api }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# /metrics is not routed by the gateway; only the monitoring namespace may scrape it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-monitoring
  labels: { app.kubernetes.io/component: api }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { healthcare-rag/monitoring: "true" }
      ports:
        - { protocol: TCP, port: 8000 }
