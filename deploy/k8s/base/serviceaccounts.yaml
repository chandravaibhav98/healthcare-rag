# Neither workload talks to the Kubernetes API, so no token is mounted (a stolen token
# would be the first thing an attacker in a compromised pod reaches for).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels: { app.kubernetes.io/component: api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels: { app.kubernetes.io/component: web }
automountServiceAccountToken: false
