# promtool unit tests for alerts.yml: each alert fires on the failure it describes and
# stays quiet on healthy traffic. Run: promtool test rules alerts.test.yml
rule_files: [alerts.yml]
evaluation_interval: 1m

tests:
  - name: healthy traffic raises nothing
    interval: 1m
    input_series:
      - series: up{job="rag-api",instance="api:8000"}
        values: 1x30
      - series: qa_requests_total{status="validated"}
        values: 0+60x30
      - series: qa_requests_total{status="needs_review"}
        values: 0+15x30
      - series: qa_latency_seconds_bucket{le="0.1"}
        values: 0+75x30
      - series: qa_latency_seconds_bucket{le="+Inf"}
        values: 0+75x30
      - series: qa_latency_seconds_count
        values: 0+75x30
      - series: http_requests_total{route="/api/v1/qa",status_code="200"}
        values: 0+75x30
      - series: http_requests_total{route="/readyz",status_code="200"}
        values: 0+6x30
      - series: qa_log_dropped_total
        values: 0x30
      - series: rag_index_info{index_version="6ce73ffaf982",pod="a"}
        values: 1x30
      - series: rag_index_info{index_version="6ce73ffaf982",pod="b"}
        values: 1x30
    alert_rule_test:
      - { eval_time: 30m, alertname: RagApiDown, exp_alerts: [] }
      - { eval_time: 30m, alertname: RagNotReady, exp_alerts: [] }
      - { eval_time: 30m, alertname: RagAbstentionSpike, exp_alerts: [] }
      - { eval_time: 30m, alertname: RagQaLatencyHigh, exp_alerts: [] }
      - { eval_time: 30m, alertname: RagServerErrors, exp_alerts: [] }
      - { eval_time: 30m, alertname: RagQueryLogDropped, exp_alerts: [] }
      - { eval_time: 30m, alertname: RagIndexVersionSplit, exp_alerts: [] }

  - name: failures fire
    interval: 1m
    input_series:
      - series: up{job="rag-api",instance="api:8000"}
        values: 0x10
      - series: http_requests_total{route="/readyz",status_code="503"}
        values: 0+6x10
      - series: qa_requests_total{status="validated"}
        values: 0+10x40
      - series: qa_requests_total{status="needs_review"}
        values: 0+50x40
      - series: qa_latency_seconds_bucket{le="0.1"}
        values: 0+5x30
      - series: qa_latency_seconds_bucket{le="0.5"}
        values: 0+10x30
      - series: qa_latency_seconds_bucket{le="+Inf"}
        values: 0+60x30
      - series: qa_latency_seconds_count
        values: 0+60x30
      - series: http_requests_total{route="/api/v1/qa",status_code="500"}
        values: 0+10x10
      - series: http_requests_total{route="/api/v1/qa",status_code="200"}
        values: 0+50x10
      - series: qa_log_dropped_total
        values: 0 0 0 5 5 5
      - series: rag_index_info{index_version="6ce73ffaf982",pod="a"}
        values: 1x30
      - series: rag_index_info{index_version="bfae4024806c",pod="b"}
        values: 1x30
    alert_rule_test:
      - eval_time: 5m
        alertname: RagApiDown
        exp_alerts:
          - exp_labels: { severity: page, job: rag-api, instance: "api:8000" }
            exp_annotations:
              summary: "RAG API target api:8000 is not scraping"
              runbook: "RUNBOOK.md §6.2 RagApiDown"
      - eval_time: 10m
        alertname: RagNotReady
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: "/readyz has been failing for 5 minutes (index or database)"
              runbook: "RUNBOOK.md §6.2 RagNotReady"
      - eval_time: 35m
        alertname: RagAbstentionSpike
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "83.33% of answers withheld over 15 minutes"
              runbook: "RUNBOOK.md §6.2 RagAbstentionSpike"
      - eval_time: 20m
        alertname: RagQaLatencyHigh
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "/qa p95 latency 500ms (target < 300 ms)"
              runbook: "RUNBOOK.md §6.2 RagQaLatencyHigh"
      - eval_time: 10m
        alertname: RagServerErrors
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: "24.24% of HTTP requests are 5xx"
              runbook: "RUNBOOK.md §6.2 RagServerErrors"
      - eval_time: 5m
        alertname: RagQueryLogDropped
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "5 query-log rows dropped in 10 minutes"
              runbook: "RUNBOOK.md §6.2 RagQueryLogDropped"
      - eval_time: 20m
        alertname: RagIndexVersionSplit
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: "2 index versions are being served at once"
              runbook: "RUNBOOK.md §6.2 RagIndexVersionSplit"
