# Optional observability profile (plan §4 Phase 8): Prometheus scrapes the API's
# /metrics on the internal network; Grafana shows the provisioned RAG dashboard.
#
#   scripts/docker-up.sh --observability
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.observability.yml up -d
#
# Grafana: http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD from .env).
# Both ports are bound to 127.0.0.1 only.
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks: [backend, observability]
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/docker-up to create .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    networks: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  observability: {}

volumes:
  prometheus: {}
  grafana: {}
